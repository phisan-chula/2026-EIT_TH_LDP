name: Deploy Thailand LDP Static JS Map
on:
  push:
    branches: [main]
    paths:
      - 'TH_LDP_Static_JS/**'
      - 'src/OUTPUT_PROV/gadm41_THA.gpkg'
      - '.github/workflows/deploy-ldp-webmap.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GDAL
        run: sudo apt-get update && sudo apt-get install -y gdal-bin
      - name: Generate 250m province GeoJSON
        run: python3 TH_LDP_Static_JS/scripts/01_simplify.py
      - name: Assemble site
        run: |
          mkdir -p _site/TH_LDP_Static_JS
          cp -r TH_LDP_Static_JS/web/. _site/TH_LDP_Static_JS/
          touch _site/.nojekyll
          printf '%s\n' '<meta http-equiv="refresh" content="0;url=TH_LDP_Static_JS/">' > _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
